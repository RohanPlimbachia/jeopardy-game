<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeopardy — Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;900&family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="join-screen" class="center-screen">
  <div class="join-form">
    <h1 class="headline-lg">Join the game</h1>
    <input id="name-input" type="text" placeholder="Your name" maxlength="20">
    <button id="join-btn" class="btn btn-primary">Join</button>
  </div>
</div>

<div id="lobby-screen" class="center-screen" style="display:none">
  <p class="label-caps">Waiting for host to start</p>
  <h1 class="headline-lg" id="lobby-title">You're in!</h1>
  <div id="lobby-players" class="scoreboard"></div>
</div>

<div id="waiting-screen" class="center-screen" style="display:none">
  <p class="label-caps" id="game-name-board">Jeopardy</p>
  <div class="pill label-caps" style="font-size:24px; padding:0.6rem 1.5rem">My score: <span id="my-score"></span></div>
  <h1 class="headline-lg">Waiting for the host to pick a question…</h1>
  <div id="scoreboard" class="scoreboard"></div>
</div>

<div id="clue-screen" class="clue-overlay" style="display:none">
  <div class="clue-card">
    <div class="pill label-caps" style="font-size:24px; padding:0.6rem 1.5rem">My score: <span id="my-score-clue"></span></div>
    <div id="buzz-status" class="label-caps"></div>
    <button id="buzz-btn" class="buzz-btn">BUZZ</button>
  </div>
</div>

<div id="results-screen" class="center-screen" style="display:none">
  <p class="label-caps">Final Results</p>
  <h1 class="display-lg winner" id="winner-name"></h1>
  <div id="results-scoreboard" class="scoreboard"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/game-ui.js"></script>
<script>
const socket = io();
socket.on('sfx', GameUI.playSound);

let myPlayerId = localStorage.getItem('jeopardy-player-id');
let myName = localStorage.getItem('jeopardy-name');

const screens = {
  join: document.getElementById('join-screen'),
  lobby: document.getElementById('lobby-screen'),
  board: document.getElementById('waiting-screen'),
  clue: document.getElementById('clue-screen'),
  results: document.getElementById('results-screen'),
};
function showScreen(name) {
  Object.entries(screens).forEach(([k, el]) => { el.style.display = k === name ? '' : 'none'; });
}

const nameInput = document.getElementById('name-input');
const joinBtn = document.getElementById('join-btn');
const buzzBtn = document.getElementById('buzz-btn');

function joinGame(name) {
  socket.emit('player:join', { name, playerId: myPlayerId }, ({ playerId }) => {
    myPlayerId = playerId;
    myName = name;
    localStorage.setItem('jeopardy-player-id', playerId);
    localStorage.setItem('jeopardy-name', name);
  });
}

joinBtn.addEventListener('click', () => {
  const name = nameInput.value.trim();
  if (!name) return;
  joinGame(name);
});
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinBtn.click(); });
buzzBtn.addEventListener('click', () => socket.emit('player:buzz'));

if (myName) nameInput.value = myName;

// Reconnect: if we already have an identity stored, rejoin silently instead
// of showing the name form again — the server restores our existing score.
// Fires on every 'connect', not just the first, so a dropped/auto-reconnected
// socket (new socket.id server-side) re-registers itself instead of looking
// joined locally while the server has no record of this connection.
socket.on('connect', () => {
  if (myPlayerId && myName) joinGame(myName);
});

socket.on('state', state => {
  // Don't trust the locally-remembered identity until the server actually
  // confirms it for THIS connection — otherwise a stale/unconfirmed
  // playerId would render game screens (from generic broadcasts every
  // socket receives) while buzzing silently fails and the host never sees us.
  const me = state.players.find(p => p.id === myPlayerId);
  if (!myPlayerId || !me) {
    showScreen('join');
    return;
  }

  if (state.phase === 'lobby') {
    document.getElementById('lobby-title').textContent = `Welcome, ${myName}`;
    GameUI.renderScoreboard(document.getElementById('lobby-players'), state.players);
    showScreen('lobby');
    return;
  }

  if (state.phase === 'results') {
    const ranked = [...state.players].sort((a, b) => b.score - a.score);
    document.getElementById('winner-name').textContent = ranked[0] ? `🏆 ${ranked[0].name} wins!` : '';
    GameUI.renderScoreboard(document.getElementById('results-scoreboard'), state.players, { rank: true });
    showScreen('results');
    return;
  }

  if (state.phase === 'clue' && state.currentClue) {
    const c = state.currentClue;
    document.getElementById('my-score-clue').textContent = me ? me.score : '';

    const iAmLocked = c.lockedPlayerIds.includes(myPlayerId);
    const someoneBuzzed = !!c.buzzedPlayerId;
    buzzBtn.disabled = !c.buzzerOpen || someoneBuzzed || iAmLocked;

    if (someoneBuzzed) {
      const buzzer = state.players.find(p => p.id === c.buzzedPlayerId);
      document.getElementById('buzz-status').textContent = `${buzzer?.name || '...'} buzzed in!`;
    } else if (iAmLocked) {
      document.getElementById('buzz-status').textContent = 'Locked out for this clue';
    } else if (!c.buzzerOpen) {
      document.getElementById('buzz-status').textContent = 'Get ready…';
    } else {
      document.getElementById('buzz-status').textContent = '';
    }
    showScreen('clue');
    return;
  }

  // board phase (and clue phase with no active clue yet, briefly)
  document.getElementById('game-name-board').textContent = state.gameName || 'Jeopardy';
  document.getElementById('my-score').textContent = me ? me.score : '';
  GameUI.renderScoreboard(document.getElementById('scoreboard'), state.players);
  showScreen('board');
});
</script>
</body>
</html>
